# 코드가 바뀔 때마다 자동 시험을 돌린다. DB·API 키가 없는 환경이므로 DB가 필요한 시험은 건너뛴다(skip).
name: test

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", ".github/workflows/test.yml"]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
